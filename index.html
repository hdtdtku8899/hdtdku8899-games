<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arcade Portal</title>
  <style>
    :root {
      --bg: #080d1a;
      --bg2: #101a2d;
      --panel: rgba(19, 27, 44, 0.87);
      --panel-2: rgba(29, 39, 60, 0.92);
      --line: rgba(255,255,255,0.08);
      --text: #edf4ff;
      --muted: #9bb0d0;
      --cyan: #50e5ff;
      --blue: #5b8cff;
      --pink: #ff5dcf;
      --gold: #ffcf5c;
      --green: #71f7a4;
      --danger: #ff6a7f;
      --shadow: rgba(0,0,0,0.3);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(80,229,255,0.14), transparent 20%),
        radial-gradient(circle at bottom right, rgba(255,93,207,0.14), transparent 20%),
        linear-gradient(135deg, var(--bg), var(--bg2));
      color: var(--text);
    }

    body {
      padding: 18px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .app {
      max-width: 1200px;
      margin: 0 auto;
      border: 1px solid var(--line);
      border-radius: 28px;
      overflow: hidden;
      background: rgba(8, 13, 26, 0.82);
      box-shadow: 0 24px 60px rgba(0,0,0,0.42);
      backdrop-filter: blur(12px);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 28px;
      border-bottom: 1px solid var(--line);
      background: rgba(11, 16, 29, 0.85);
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      color: #07131e;
      box-shadow: 0 0 26px rgba(80,229,255,0.5);
    }

    .brand-text {
      font-size: clamp(1rem, 2vw, 1.5rem);
    }

    .brand-text span {
      color: var(--cyan);
      text-shadow: 0 0 10px rgba(80,229,255,0.55);
    }

    .nav {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .nav a {
      padding: 10px 14px;
      border-radius: 12px;
      color: var(--muted);
      font-weight: 700;
      border: 1px solid transparent;
      transition: 0.2s ease;
    }

    .nav a:hover {
      color: var(--text);
      border-color: rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.02);
    }

    .nav a.primary {
      background: linear-gradient(135deg, var(--pink), var(--cyan));
      color: #0b1120;
      box-shadow: 0 0 20px rgba(255,93,207,0.35);
    }

    .hero {
      padding: 28px;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(135deg, rgba(80,229,255,0.07), rgba(255,93,207,0.05)),
        rgba(10,15,25,0.4);
    }

    .hero-inner {
      display: grid;
      grid-template-columns: 1.4fr 0.9fr;
      gap: 20px;
      align-items: center;
    }

    .hero-copy h1 {
      margin: 0 0 14px;
      font-size: clamp(2.2rem, 5vw, 4.2rem);
      line-height: 0.96;
      letter-spacing: -0.06em;
    }

    .hero-copy h1 span {
      color: var(--cyan);
      text-shadow: 0 0 18px rgba(80,229,255,0.6);
    }

    .hero-copy p {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 1.08rem;
      line-height: 1.6;
      max-width: 600px;
    }

    .hero-actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 12px 18px;
      border-radius: 14px;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      border: 1px solid transparent;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.18s ease;
      font-size: 0.82rem;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      color: #05141d;
      box-shadow: 0 14px 30px rgba(80,229,255,0.28);
    }

    .btn.secondary {
      background: rgba(255,255,255,0.02);
      border-color: rgba(255,255,255,0.08);
      color: var(--text);
    }

    .hero-panel {
      display: grid;
      grid-template-columns: repeat(2, minmax(130px, 1fr));
      gap: 12px;
    }

    .stat-card {
      background: linear-gradient(180deg, rgba(18, 27, 43, 0.9), rgba(24, 33, 52, 0.9));
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      min-height: 110px;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(80,229,255,0.12), transparent 50%, rgba(255,93,207,0.12));
      pointer-events: none;
    }

    .stat-card .kicker {
      position: relative;
      z-index: 1;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .stat-card .value {
      position: relative;
      z-index: 1;
      margin-top: 14px;
      font-size: clamp(1.7rem, 3vw, 2.3rem);
      font-weight: 900;
    }

    .content {
      padding: 28px;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(240px, 1fr));
      gap: 20px;
    }

    .game-card {
      background: linear-gradient(180deg, rgba(17,23,38,0.96), rgba(22,32,52,0.96));
      border: 1px solid var(--line);
      border-radius: 22px;
      overflow: hidden;
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      box-shadow: 0 14px 30px rgba(0,0,0,0.18);
    }

    .game-card:hover {
      transform: translateY(-4px);
      border-color: rgba(80,229,255,0.4);
      box-shadow: 0 18px 40px rgba(80,229,255,0.08);
    }

    .game-thumb {
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      position: relative;
      background: linear-gradient(135deg, rgba(80,229,255,0.12), rgba(255,93,207,0.08));
      border-bottom: 1px solid var(--line);
    }

    .game-thumb::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent, rgba(0,0,0,0.16));
    }

    .game-body {
      padding: 18px 18px 16px;
    }

    .tag {
      display: inline-block;
      padding: 6px 9px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.08);
      font-size: 0.7rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      background: rgba(255,255,255,0.02);
      margin-bottom: 12px;
    }

    .game-card h3 {
      margin: 0 0 8px;
      font-size: 1.7rem;
      letter-spacing: -0.04em;
    }

    .game-card p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.55;
      min-height: 66px;
    }

    .game-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .score-pill {
      color: var(--gold);
      font-weight: 800;
      font-size: 1rem;
    }

    .play-btn {
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--pink), var(--cyan));
      color: #06111b;
      font-weight: 900;
      padding: 10px 14px;
      min-width: 120px;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .play-btn:hover {
      transform: translateY(-2px);
    }

    .panel {
      display: none;
      margin-top: 24px;
      background: rgba(16, 24, 38, 0.85);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 18px;
    }

    .panel.active {
      display: block;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .panel-header h2 {
      margin: 0;
      font-size: clamp(1.5rem, 3vw, 2.5rem);
    }

    .hud {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hud-box {
      min-width: 120px;
      padding: 10px 12px;
      border-radius: 12px;
      text-align: center;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
    }

    .hud-box .label {
      display: block;
      color: var(--muted);
      font-size: 0.7rem;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .hud-box .value {
      display: block;
      margin-top: 8px;
      font-size: 1.4rem;
      font-weight: 900;
    }

    .game-stage {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 20px;
      margin-top: 16px;
    }

    .arena {
      min-height: 270px;
      background:
        linear-gradient(180deg, rgba(9,14,23,0.85), rgba(16,26,40,0.9)),
        linear-gradient(135deg, rgba(80,229,255,0.06), rgba(255,93,207,0.08));
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      position: relative;
      overflow: hidden;
    }

    .arena::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 22px 22px;
    }
